<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Project Alpha</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#F8F9FA',      // Main background
                            card: '#E9ECEF',    // Card/Container background
                            border: '#DEE2E6',  // Borders/Dividers/Hover
                            primary: '#343A40', // Primary text, icons, button bg
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #F8F9FA;
            color: #343A40;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom spinner using border color for track and primary for indicator */
        .spinner {
            border: 3px solid #DEE2E6;
            border-top: 3px solid #F8F9FA; /* Contrasts against the dark button */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-brand-border selection:text-brand-primary">

    <main class="flex-grow flex flex-col items-center justify-center px-6 py-12 w-full max-w-2xl mx-auto z-10">
        
        <div class="mb-8 p-6 bg-brand-card border border-brand-border rounded-3xl shadow-sm transition-transform duration-300 hover:scale-[1.02]">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-brand-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />
            </svg>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-4 text-brand-primary">Project Alpha</h1>
            <p class="text-base sm:text-lg text-brand-primary/80 max-w-md mx-auto leading-relaxed">
                A streamlined, ad-free utility tool designed for maximum efficiency. Clean, light, and undeniably fast.
            </p>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-3 mb-10 text-sm font-medium text-brand-primary">
            <div class="flex items-center gap-2 px-4 py-2 bg-brand-card rounded-xl border border-brand-border">
                <svg class="w-4 h-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                </svg>
                v2.0.1
            </div>
            <div class="flex items-center gap-2 px-4 py-2 bg-brand-card rounded-xl border border-brand-border">
                <svg class="w-4 h-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                </svg>
                12.4 MB
            </div>
        </div>

        <div class="w-full flex flex-col items-center">
            <button id="downloadBtn" class="group relative w-full sm:w-auto min-w-[260px] bg-brand-primary text-brand-bg px-8 py-4 rounded-xl font-semibold text-lg transition-all duration-200 hover:bg-brand-primary/90 active:scale-95 flex items-center justify-center gap-3 focus:outline-none focus:ring-4 focus:ring-brand-border">
                
                <div id="btnContent" class="flex items-center gap-3">
                    <svg id="iconDefault" class="w-6 h-6 transition-transform duration-300 group-hover:-translate-y-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    
                    <div id="iconSpinner" class="spinner hidden"></div>

                    <svg id="iconSuccess" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>

                    <span id="btnText">Download APK</span>
                </div>
            </button>
            <p class="mt-4 text-sm text-brand-primary/60">Verified safe & secure installation.</p>
        </div>
    </main>

    <footer class="w-full py-6 text-center border-t border-brand-border bg-brand-bg mt-auto">
        <p class="text-sm text-brand-primary/50">&copy; 2026 Developer Studio. Single-purpose utility client.</p>
    </footer>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 sm:bottom-10 sm:right-10 w-[90%] max-w-sm sm:w-80 bg-brand-primary text-brand-bg p-5 rounded-2xl shadow-xl transform translate-y-24 opacity-0 pointer-events-none transition-all duration-500 z-50">
        <div class="flex items-center gap-4 mb-3">
            <div class="bg-brand-card p-2 rounded-lg text-brand-primary">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
            </div>
            <div>
                <h4 id="toastTitle" class="font-semibold text-sm">Downloading</h4>
                <p class="text-brand-bg/70 text-xs mt-0.5">Project_Alpha_v2.0.1.apk</p>
            </div>
        </div>
        
        <!-- Progress bar container -->
        <div class="w-full h-2 bg-brand-bg/20 rounded-full overflow-hidden mt-4">
            <div id="toastProgress" class="h-full bg-brand-bg w-0 transition-all duration-[2500ms] ease-out rounded-full"></div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('downloadBtn');
        const btnText = document.getElementById('btnText');
        const iconDefault = document.getElementById('iconDefault');
        const iconSpinner = document.getElementById('iconSpinner');
        const iconSuccess = document.getElementById('iconSuccess');
        
        const toast = document.getElementById('toast');
        const toastTitle = document.getElementById('toastTitle');
        const toastProgress = document.getElementById('toastProgress');
        
        let isDownloading = false;

        btn.addEventListener('click', (e) => {
            e.preventDefault();
            if (isDownloading) return;
            isDownloading = true;

            // 1. Update Button State
            btnText.textContent = "Processing...";
            iconDefault.classList.add('hidden');
            iconSpinner.classList.remove('hidden');
            btn.classList.add('opacity-90', 'cursor-not-allowed', 'scale-95');
            btn.classList.remove('hover:bg-brand-primary/90', 'active:scale-95');

            // 2. Show Toast Notification
            toast.classList.remove('translate-y-24', 'opacity-0');
            toastTitle.textContent = "Downloading...";
            
            // Start progress bar animation
            setTimeout(() => {
                toastProgress.style.width = '100%';
            }, 100);

            // 3. Simulate Download Completion
            setTimeout(() => {
                // Update Toast
                toastTitle.textContent = "Download Complete";
                
                // Update Button
                btnText.textContent = "Downloaded";
                iconSpinner.classList.add('hidden');
                iconSuccess.classList.remove('hidden');
                
                // Trigger real browser download action
                triggerRealDownload();

                // 4. Hide Toast & Reset UI after a delay
                setTimeout(() => {
                    hideToast();
                    resetButton();
                }, 3500);

            }, 2600); // Wait for progress bar (2.5s) + small buffer
        });

        function hideToast() {
            toast.classList.add('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toastProgress.style.transition = 'none';
                toastProgress.style.width = '0';
                setTimeout(() => {
                    toastProgress.style.transition = 'all 2500ms ease-out';
                }, 50);
            }, 500); // Wait for fade out animation
        }

        function triggerRealDownload() {
            // Create a hidden link element
            const a = document.createElement('a');
            a.style.display = 'none';
            
            // Point the link to your actual APK file in the same directory
            a.href = 'app-debug.apk'; 
            
            // Set the default name for the downloaded file
            a.download = 'viewny.apk'; 
            
            // Append to body, trigger click, and clean up
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function resetButton() {
            isDownloading = false;
            
            btnText.textContent = "Download APK";
            iconSuccess.classList.add('hidden');
            iconDefault.classList.remove('hidden');
            
            btn.classList.remove('opacity-90', 'cursor-not-allowed', 'scale-95');
            btn.classList.add('hover:bg-brand-primary/90', 'active:scale-95');
        }
    </script>
</body>
</html>
